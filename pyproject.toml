[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-strategy-research"
version = "0.1.0"
description = "Versioned, leak-aware A-share strategy research components"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.3,<3.0",
  "scipy>=1.10,<2.0",
  "scikit-learn>=1.3,<2.0",
  "tabulate>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
norecursedirs = [
  "cache",
  "output",
  "research_data",
  "external_references",
  ".tmp_python",
  "__pycache__",
]
